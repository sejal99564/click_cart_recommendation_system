name: Shopwise AI checks
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: tests-only
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U retail -d retail" --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
        env:
          SHOPWISE_TEST_DATABASE_URL: postgresql+psycopg://retail:tests-only@localhost:5432/retail

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ml/requirements.txt pytest
      - run: python -m pytest ml/tests -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py -q
        working-directory: backend
        env:
          SHOPWISE_BROWSER_TESTS: '1'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose up --build --wait --wait-timeout 120
      - run: python scripts/smoke_preview.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
